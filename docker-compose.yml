services:
  mysql-expense:
    image: mysql:8.0
    container_name: mysql-expense
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense
      MYSQL_USER: expense
      MYSQL_PASSWORD: expense
    volumes:
      - mysql-expense-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s 
      timeout: 5s 
      retries: 5
      start_period: 30s 

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0
    container_name: redis-auth
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    image: zrua/auth-service:1.0.0
    container_name: auth-service
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECURITY_JWT_PRIVATE_KEY_PATH: classpath:keys/private_key.pem
      SECURITY_JWT_PUBLIC_KEY_PATH: classpath:keys/public_key.pem
      SECURITY_JWT_EXPIRATION_TIME: 900000
      SECURITY_JWT_REFRESH_EXPIRATION_TIME: 259200000
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - backend-net

  expense-service:
    image: zrua/expense-service:1.0.0
    container_name: expense-service
    depends_on:
      mysql-expense:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECURITY_JWT_PUBLIC_KEY_PATH: classpath:keys/public_key.pem
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-expense:3306/expense
      SPRING_DATASOURCE_USERNAME: expenseuser
      SPRING_DATASOURCE_PASSWORD: expensepass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - backend-net

  api-gateway:
    image: zrua/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "80:8000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      expense-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: false
      SECURITY_JWT_PRIVATE_KEY_PATH: classpath:keys/private_key.pem
      SECURITY_JWT_PUBLIC_KEY_PATH: classpath:keys/public_key.pem
      SECURITY_JWT_EXPIRATION_TIME: 3600000
      SECURITY_JWT_REFRESH_EXPIRATION_TIME: 259200000
      AUTH_SERVICE_URL: http://auth-service:8080
    networks:
      - backend-net

volumes:
  mysql-expense-data:
  mysql-auth-data:
  redis-data:
  
networks:
  backend-net:
    driver: bridge
